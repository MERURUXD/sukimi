# 推送到 preview 分支（或手动指定分支）后打包 Preview 构建，发布到滚动的 webui-preview 预发布版本。
# 与 webui-latest 分开：日用版服务器只拉 webui-latest，Preview 服务器的定时任务只拉这里。
name: webui-preview

on:
  push:
    branches: [preview]
  pull_request:
  workflow_dispatch:
    inputs:
      ref:
        description: 要发布到 Preview 的分支、标签或提交（留空为所选分支）
        required: false
        default: ''

# 默认只读。permissions 不能按事件切换，写权限若放在 ci-preview 上，拉取请求也会带上。
# 检查作业 id 必须仍是 ci-preview（main ruleset 按这个名字要求通过），不要另加 name。
# 推送到 preview 和手动触发走 publish：该作业显式 contents: write，才能强制更新 webui-preview
# 标签并上传 sukimi-webui-preview.tar、sukimi-webui-preview.json。发布命令和产物名不变。
permissions:
  contents: read

# 和 webui-release 不同组：两边互不取消。拉取请求单独成组，不取消正在发布的作业
concurrency:
  group: webui-preview-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-preview:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.ref || github.ref }}
      # pnpm/action-setup v6.1.0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      # actions/setup-node v7.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
        env:
          SUKIMI_CHANNEL: preview

  # 检查步骤与 ci-preview 相同，后面才是原来的打包和发布。
  publish:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.ref || github.ref }}
      # pnpm/action-setup v6.1.0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      # actions/setup-node v7.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
        env:
          SUKIMI_CHANNEL: preview

      # 拉取请求只做检查和构建，不打标签、不上传
      - name: 打包与清单
        if: github.event_name != 'pull_request'
        run: |
          commit=$(git rev-parse --short HEAD)
          now=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          printf '{\n  "deployedAt": "%s",\n  "commit": "%s",\n  "channel": "preview"\n}\n' "$now" "$commit" > dist/.suwayomi-web
          tar -cf sukimi-webui-preview.tar -C dist .
          sha=$(sha256sum sukimi-webui-preview.tar | cut -d' ' -f1)
          printf '{"commit":"%s","sha256":"%s","builtAt":"%s","channel":"preview"}\n' "$commit" "$sha" "$now" > sukimi-webui-preview.json
          cat sukimi-webui-preview.json

      - name: 发布到 webui-preview
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # GitHub 接口偶尔返回 5xx，每步最多试 4 次
          retry() {
            for i in 1 2 3 4; do
              "$@" && return 0
              echo "第 $i 次失败，稍后重试：$*"
              sleep $((i * 10))
            done
            return 1
          }
          git tag -f webui-preview
          retry git push -f origin webui-preview
          gh release view webui-preview >/dev/null 2>&1 ||
            retry gh release create webui-preview --prerelease --title 'Preview 构建' --notes '由 webui-preview 自动更新，Preview 服务器定时拉取。与日用版共用同一个 Suwayomi，写入的是真实数据。'
          # 清单最后上传：服务器读到新清单时，归档已经是同一版；万一读到一半，哈希不符会等下一轮
          retry gh release upload webui-preview sukimi-webui-preview.tar --clobber
          retry gh release upload webui-preview sukimi-webui-preview.json --clobber

# 推送到 main 后检查并打包前端，发布到滚动的 webui-latest 预发布版本。
# 服务器上的定时任务读取这里的清单，校验哈希后免重启热更新。
name: webui-release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

# 连续推送时只发布最后一次；拉取请求单独成组，不取消正在发布的作业
concurrency:
  group: webui-release-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v4.4.0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      # pnpm/action-setup v4.3.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      # actions/setup-node v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

      # 拉取请求只做检查和构建，不打标签、不上传
      - name: 打包与清单
        if: github.event_name != 'pull_request'
        run: |
          commit=$(git rev-parse --short HEAD)
          now=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          printf '{\n  "deployedAt": "%s",\n  "commit": "%s"\n}\n' "$now" "$commit" > dist/.suwayomi-web
          tar -cf sukimi-webui.tar -C dist .
          (cd dist && zip -qr ../sukimi-webui.zip .)
          sha=$(sha256sum sukimi-webui.tar | cut -d' ' -f1)
          zip_sha=$(sha256sum sukimi-webui.zip | cut -d' ' -f1)
          printf '{"commit":"%s","sha256":"%s","zipSha256":"%s","builtAt":"%s"}\n' "$commit" "$sha" "$zip_sha" "$now" > sukimi-webui.json
          cat sukimi-webui.json

      - name: 发布到 webui-latest
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # GitHub 接口偶尔返回 5xx，每步最多试 4 次
          retry() {
            for i in 1 2 3 4; do
              "$@" && return 0
              echo "第 $i 次失败，稍后重试：$*"
              sleep $((i * 10))
            done
            return 1
          }
          git tag -f webui-latest
          retry git push -f origin webui-latest
          gh release view webui-latest >/dev/null 2>&1 ||
            retry gh release create webui-latest --prerelease --title '前端最新构建' --notes '由 webui-release 自动更新，服务器定时拉取。'
          # 清单最后上传：服务器读到新清单时，归档已经是同一版；万一读到一半，哈希不符会等下一轮
          retry gh release upload webui-latest sukimi-webui.tar --clobber
          retry gh release upload webui-latest sukimi-webui.zip --clobber
          retry gh release upload webui-latest sukimi-webui.json --clobber

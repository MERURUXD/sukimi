# pnpm 11 默认只安装发布满一天的版本。@sessile/* 是我们自己维护的包，刚发布就要用，所以只放行这四个确切版本；
# 发布满一天后这段可以删掉。
minimumReleaseAgeExclude:
  - '@sessile/core@0.1.0'
  - '@sessile/dom@0.1.0'
  - '@sessile/presets@0.1.0'
  - '@sessile/react@0.1.0'
# pnpm 11 不再读取 package.json 里的 pnpm 字段，依赖覆盖写在这里。
# utils 限定在已修补的 12.x：13 去掉了 createGraphQLError，@graphql-tools/import 仍要求 ^12，会让 codegen 崩溃。
overrides:
  "@graphql-tools/utils": "^12.0.2"
